name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Deploy PHP Website via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Hostname
        id: prep
        env:
          FTP_SERVER_VAL: ${{ secrets.FTP_SERVER_2 }}
        run: |
          SERVER="${FTP_SERVER_VAL:-195.35.44.52}"
          CLEAN_SERVER=$(echo "$SERVER" | sed -E 's|^[a-zA-Z]+://||; s|/*$||')
          echo "host=$CLEAN_SERVER" >> $GITHUB_OUTPUT

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.prep.outputs.host }}
          username: ${{ secrets.FTP_USERNAME_2 }}
          password: ${{ secrets.FTP_PASSWORD_2 }}
          local-dir: ./
          server-dir: public_html/
          protocol: ftps
          port: 21
          security: loose
          dangerous-clean-slate: true
          exclude: |
            .git*
            .git*/**
            .env
            *.md
            .agents/**
            .github/**