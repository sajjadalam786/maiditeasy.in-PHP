name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Deploy PHP Website via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER_2 || secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME_2 || secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD_2 || secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          port: ${{ secrets.FTP_PORT || 21 }}
          security: loose
          exclude: |
            **/.git*
            **/.git*/**
            .env
            config.env
            *.md
            .agents/**
            .github/**
